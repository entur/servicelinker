  - Norway (nationwide), Entur

description:
  en:
    localisedName: ServiceLinker
    shortDescription: Adds missing NeTEx ServiceLinks with OSRM-routed geometry.
    longDescription: >
      ServiceLinker finds journey patterns with no ServiceLink between consecutive stops and routes them through
      transport mode-specific OSRM instances, adding GML LineString geometry and distances. Existing ServiceLinks
      are kept.
    documentation: https://github.com/entur/servicelinker/blob/main/README.md
    features:
      - Detects missing ServiceLinks in journey patterns
      - Mode-specific OSRM routing for bus, rail, ferry and water
      - Adds GML LineString geometry and distances
      - Never overwrites existing ServiceLinks
      - Event-driven over PubSub, plus a REST API

