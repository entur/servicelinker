name: Build it

on:
  push:
  pull_request:

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    uses: entur/gha-docker/.github/workflows/lint.yml@dcdc76ce2d251de20f35a92c566d8fe99036e03e # v1.13.0

  gradle-build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: entur/ror-gha-workflows/.github/actions/gradle-cache@cd8dd047eb3a5d9497f46454a5c60315a62c6a66 # v1.2.2
        with:
          java-version: '25'

      - name: Build with Gradle
        run: ./gradlew --no-daemon build

      - name: Archive Build Artifacts
        if: success() && (github.event_name == 'pull_request' || github.ref == 'refs/heads/main')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jar-artifact
          path: build/libs
          retention-days: 1
          overwrite: true

  # The image entur/servicelinker-deployment-config scans, pushes to GAR and
  # deploys (it downloads the `servicelinker` artifact from this run). No GCP:
  # the job only gets id-token because gha-docker's build.yml asks for it.
  docker-build:
    name: Docker Build
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    needs: [gradle-build, lint]
    permissions:
      contents: read
      id-token: write
    uses: entur/gha-docker/.github/workflows/build.yml@a1d476b895a271d0fe8557f1b763529b64fb0554 # v1.14.0
    with:
      authenticate: false
      build_artifact_name: jar-artifact
      build_artifact_path: build/libs

  scan:
    needs: [docker-build]
    # What docker-scan.yml asks for: SARIF upload, PR comment, issues.
    permissions:
      contents: write
      issues: write
      pull-requests: write
      security-events: write
      actions: read
    uses: entur/gha-security/.github/workflows/docker-scan.yml@0962fb4f3f9004eeaea88582db8639e140ec6fda # v2.17.1
    with:
      image_artifact: ${{ needs.docker-build.outputs.image_artifact }}

  # Push and deploy happen in the internal entur/servicelinker-deployment-config.
  trigger-deploy:
    if: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' && github.repository_owner == 'entur' }}
    needs: [gradle-build, lint, docker-build]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: deploy-trigger
    permissions: {}
    steps:
      - env:
          GH_TOKEN: ${{ secrets.DEPLOY_TRIGGER_TOKEN }}
        # REST dispatch with an explicit ref: the token only has Actions access,
        # which `gh workflow run`'s default-branch lookup can't use. A missing
        # run link must not fail the job once the dispatch went through.
        run: |
          out=$(gh api -X POST repos/entur/servicelinker-deployment-config/actions/workflows/deploy.yml/dispatches \
            -f ref=main -f "inputs[run_id]=$GITHUB_RUN_ID" -F return_run_details=true)
          url=$(jq -r '.html_url // empty' <<<"$out" 2>/dev/null || true)
          echo "Deploy run: ${url:-https://github.com/entur/servicelinker-deployment-config/actions/workflows/deploy.yml}" | tee -a "$GITHUB_STEP_SUMMARY"
