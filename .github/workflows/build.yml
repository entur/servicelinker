name: Build it

on:
  push:
  pull_request:

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  lint:
    uses: entur/gha-docker/.github/workflows/lint.yml@v1

  gradle-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - uses: entur/ror-gha-workflows/.github/actions/gradle-cache@main
        with:
          java-version: '25'

      - name: Build with Gradle
        run: ./gradlew --no-daemon build

      - name: Archive Build Artifacts
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: jar-artifact
          path: build/libs
          retention-days: 1
          overwrite: true

  docker-build:
    needs: [ gradle-build, lint ]
    uses: entur/gha-docker/.github/workflows/build.yml@v1
    with:
      build_artifact_name: jar-artifact
      build_artifact_path: build/libs

  docker-push:
    if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
    needs: docker-build
    uses: entur/gha-docker/.github/workflows/push.yml@v1

  scan:
    needs: [docker-build]
    uses: entur/gha-security/.github/workflows/docker-scan.yml@v2
    with:
      image_artifact: ${{ needs.docker-build.outputs.image_artifact }}

  deploy-dev:
    if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
    needs: docker-push
    uses: entur/gha-helm/.github/workflows/deploy.yml@v1
    with:
      environment: dev
      image: ${{ needs.docker-push.outputs.image_name }}:${{ needs.docker-push.outputs.image_tag}}
      chart: helm/servicelinker
      namespace: servicelinker
      release_name: servicelinker
    secrets: inherit

  approval-tst:
    if: ${{ github.ref == 'refs/heads/main' }}
    needs: deploy-dev
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: Approve
    steps:
      - name: Manual approval
        shell: bash
        run: echo "Approve TST deployment"

  deploy-tst:
    if: ${{ github.ref == 'refs/heads/main' }}
    needs: [docker-push, approval-tst]
    uses: entur/gha-helm/.github/workflows/deploy.yml@v1
    with:
      environment: tst
      image: ${{ needs.docker-push.outputs.image_name }}:${{ needs.docker-push.outputs.image_tag}}
      chart: helm/servicelinker
      namespace: servicelinker
      release_name: servicelinker
    secrets: inherit

  approval-prd:
    if: ${{ github.ref == 'refs/heads/main' }}
    needs: deploy-tst
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: Approve
    steps:
      - name: Manual approval
        shell: bash
        run: echo "Approve PRD deployment"

  deploy-prd:
    if: ${{ github.ref == 'refs/heads/main' }}
    needs: [docker-push, approval-prd]
    uses: entur/gha-helm/.github/workflows/deploy.yml@v1
    with:
      environment: prd
      image: ${{ needs.docker-push.outputs.image_name }}:${{ needs.docker-push.outputs.image_tag}}
      chart: helm/servicelinker
      namespace: servicelinker
      release_name: servicelinker
    secrets: inherit
