name: Build it

on:
  push:
  pull_request:

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    uses: entur/gha-docker/.github/workflows/lint.yml@dcdc76ce2d251de20f35a92c566d8fe99036e03e # v1.13.0

  gradle-build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: entur/ror-gha-workflows/.github/actions/gradle-cache@cd8dd047eb3a5d9497f46454a5c60315a62c6a66 # v1.2.2
        with:
          java-version: '25'

      - name: Build with Gradle
        run: ./gradlew --no-daemon build

      - name: Archive Build Artifacts
        if: success() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jar-artifact
          path: build/libs
          retention-days: 1
          overwrite: true

  # PRs only: on main, servicelinker-deployment-config builds and scans the
  # image it deploys. Plain build because gha-docker's build.yml requires GCP
  # credentials, which this repo does not have. The artifact layout matches
  # what docker-scan expects (artifact `servicelinker` holding `servicelinker.tar`).
  docker-build:
    name: Docker Build
    if: github.event_name == 'pull_request'
    needs: [gradle-build, lint]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      image_artifact: servicelinker
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: jar-artifact
          path: build/libs
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          tags: servicelinker
          outputs: type=docker,dest=/tmp/servicelinker.tar
          push: false
          provenance: false
          cache-from: type=gha,ignore-error=true
          cache-to: type=gha,mode=max,ignore-error=true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: servicelinker
          path: /tmp/servicelinker.tar
          retention-days: 1

  scan:
    needs: [docker-build]
    uses: entur/gha-security/.github/workflows/docker-scan.yml@89ffce329b85b10d285defb50bb58c35227d4305 # v2.17.0
    with:
      image_artifact: ${{ needs.docker-build.outputs.image_artifact }}

  # Build, push and deploy happen in entur/servicelinker-deployment-config.
  trigger-deploy:
    if: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' && github.repository_owner == 'entur' }}
    needs: [gradle-build, lint]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: deploy-trigger
    permissions: {}
    steps:
      - env:
          GH_TOKEN: ${{ secrets.DEPLOY_TRIGGER_TOKEN }}
        # REST dispatch with an explicit ref: the token only has Actions access,
        # which `gh workflow run`'s default-branch lookup can't use. A missing
        # run link must not fail the job once the dispatch went through.
        run: |
          out=$(gh api -X POST repos/entur/servicelinker-deployment-config/actions/workflows/deploy.yml/dispatches \
            -f ref=main -f "inputs[sha]=$GITHUB_SHA" -F return_run_details=true)
          url=$(jq -r '.html_url // empty' <<<"$out" 2>/dev/null || true)
          echo "Deploy run: ${url:-https://github.com/entur/servicelinker-deployment-config/actions/workflows/deploy.yml}" | tee -a "$GITHUB_STEP_SUMMARY"
