name: Dependency submission

# Submits the resolved runtime dependency graph so Dependabot alerts also cover
# transitive and BOM-managed dependencies. Build tooling and test dependencies
# are left out, since they never ship.

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  submit:
    if: github.repository_owner == 'entur'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: liberica
          java-version: 25
      - uses: gradle/actions/dependency-submission@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          dependency-graph-include-configurations: '^runtimeClasspath$'
