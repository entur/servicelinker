# Dev environment
spring.cloud.gcp.project-id=ent-servicelnk-dev

# GCS buckets
gcs.bucket.input=marduk-exchange-dev
gcs.bucket.output=ror-servicelinker-exchange-gcp-dev

# Outbound topic is in Marduk's project, must use full path
servicelinker.pubsub.outbound.topic=projects/ent-marduk-dev/topics/ServicelinkerStatusQueue

# OSRM - dev internal services
osrm.urls.bus=http://osrm-bus.dev.entur.internal
osrm.urls.rail=http://osrm-rail.dev.entur.internal
osrm.urls.ferry=http://osrm-water.dev.entur.internal
osrm.urls.water=http://osrm-water.dev.entur.internal
osrm.urls.default=http://osrm-car.dev.entur.internal

logging.level.no.entur.servicelinker=DEBUG
