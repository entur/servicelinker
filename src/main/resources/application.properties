spring.application.name=servicelinker

# Google Cloud configuration
spring.cloud.gcp.project-id=${GCP_PROJECT_ID:entur-project}

# PubSub configuration
servicelinker.pubsub.inbound.subscription=${PUBSUB_INBOUND_SUBSCRIPTION:servicelinker-inbound-sub}
servicelinker.pubsub.outbound.topic=${PUBSUB_OUTBOUND_TOPIC:servicelinker-outbound}

# GCS configuration
gcs.bucket.input=${GCS_INPUT_BUCKET:marduk-exchange}
gcs.bucket.output=${GCS_OUTPUT_BUCKET:servicelinker-exchange}

# OSRM configuration - per-mode URLs
osrm.urls.bus=${OSRM_URL_BUS:https://router.project-osrm.org}
osrm.urls.rail=${OSRM_URL_RAIL:https://router.project-osrm.org}
osrm.urls.ferry=${OSRM_URL_FERRY:https://router.project-osrm.org}
osrm.urls.water=${OSRM_URL_WATER:https://router.project-osrm.org}
osrm.urls.default=${OSRM_URL_DEFAULT:https://router.project-osrm.org}
osrm.timeout=${OSRM_TIMEOUT:30000}
osrm.cache-routes=${OSRM_CACHE_ROUTES:true}

# Logging
logging.level.no.entur.servicelinker=DEBUG
logging.level.org.springframework.cloud.gcp=INFO

# Actuator configuration
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
