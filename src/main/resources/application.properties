spring.application.name=servicelinkproducer

# Google Cloud configuration
spring.cloud.gcp.project-id=${GCP_PROJECT_ID:entur-project}
spring.cloud.gcp.credentials.location=${GOOGLE_APPLICATION_CREDENTIALS:}

# PubSub configuration
spring.cloud.gcp.pubsub.subscription-name=${PUBSUB_SUBSCRIPTION:servicelink-trigger}
spring.cloud.gcp.pubsub.topic-name=${PUBSUB_TOPIC:servicelink-topic}

# GCS configuration
gcs.bucket.input=${GCS_INPUT_BUCKET:netex-files}
gcs.bucket.output=${GCS_OUTPUT_BUCKET:netex-processed}

# OSRM configuration
osrm.base-url=${OSRM_BASE_URL:https://router.project-osrm.org}
osrm.timeout=${OSRM_TIMEOUT:30000}

# ServiceLink configuration
servicelink.id-prefix=${SERVICELINK_ID_PREFIX:SL_}
servicelink.cache-routes=${SERVICELINK_CACHE_ROUTES:true}

# Logging
logging.level.no.entur.servicelinkproducer=DEBUG
logging.level.org.springframework.cloud.gcp=INFO
