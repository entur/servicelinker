spring.application.name=servicelinker

# Activate Spring profile from k8s COMMON_ENV (dev/tst/prd)
spring.profiles.active=${COMMON_ENV:}

# Google Cloud configuration
spring.cloud.gcp.project-id=${GCP_PROJECT_ID:local-project}

# PubSub configuration
servicelinker.pubsub.inbound.subscription=ServicelinkerInboundQueue
servicelinker.pubsub.outbound.topic=ServicelinkerStatusQueue

# GCS configuration
gcs.bucket.input=marduk-exchange
gcs.bucket.output=servicelinker-exchange

# OSRM configuration - defaults to public OSRM, overridden per environment
osrm.urls.bus=https://router.project-osrm.org
osrm.urls.rail=https://router.project-osrm.org
osrm.urls.ferry=https://router.project-osrm.org
osrm.urls.water=https://router.project-osrm.org
osrm.urls.default=https://router.project-osrm.org
osrm.timeout=30000
osrm.cache-routes=true

# NSR (National Stop Register) configuration - defaults to public API
nsr.base-url=https://api.entur.io/stop-places/v1/read
nsr.timeout=10000
nsr.cache-coordinates=true

# Logging
logging.level.no.entur.servicelinker=DEBUG

# 15 min async timeout (ms) for REST API calls (OSRM per-call timeout (osrm.timeout) is the real guard)
spring.mvc.async.request-timeout=900000

# Actuator configuration
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
