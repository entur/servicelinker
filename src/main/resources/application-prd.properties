# Production environment
spring.cloud.gcp.project-id=ent-servicelnk-prd

# GCS buckets
gcs.bucket.input=marduk-exchange-production
gcs.bucket.output=ror-servicelinker-exchange-gcp-prd

# Outbound topic is in Marduk's project, must use full path
servicelinker.pubsub.outbound.topic=projects/ent-marduk-prd/topics/ServicelinkerStatusQueue

# OSRM - production internal services
osrm.urls.bus=http://osrm-bus.prd.entur.internal
osrm.urls.rail=http://osrm-rail.prd.entur.internal
osrm.urls.ferry=http://osrm-water.prd.entur.internal
osrm.urls.water=http://osrm-water.prd.entur.internal
osrm.urls.default=http://osrm-bus.prd.entur.internal

logging.level.no.entur.servicelinker=INFO
