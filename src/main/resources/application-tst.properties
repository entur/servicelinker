# Test environment
spring.cloud.gcp.project-id=ent-servicelnk-tst

# GCS buckets
gcs.bucket.input=marduk-exchange-test
gcs.bucket.output=ror-servicelinker-exchange-gcp-tst

# Outbound topic is in Marduk's project, must use full path
servicelinker.pubsub.outbound.topic=projects/ent-marduk-tst/topics/ServicelinkerStatusQueue

# OSRM - tst internal services
osrm.urls.bus=http://osrm-bus.tst.entur.internal
osrm.urls.rail=http://osrm-rail.tst.entur.internal
osrm.urls.ferry=http://osrm-ferry.tst.entur.internal
osrm.urls.water=http://osrm-water.tst.entur.internal
osrm.urls.default=http://osrm-car.tst.entur.internal

logging.level.no.entur.servicelinker=DEBUG
