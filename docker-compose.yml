services:
  pubsub-emulator:
    image: gcr.io/google.com/cloudsdktool/google-cloud-cli:latest
    command: >
      bash -c "
        gcloud beta emulators pubsub start --host-port=0.0.0.0:8085 --project=local-project
      "
    ports:
      - "8085:8085"
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/8085'"]
      interval: 5s
      timeout: 3s
      retries: 5

  fake-gcs:
    image: fsouza/fake-gcs-server:latest
    command: ["-scheme", "http", "-port", "4443", "-external-url", "http://localhost:4443", "-public-host", "localhost:4443"]
    ports:
      - "4443:4443"
    volumes:
      - gcs-data:/storage
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:4443/storage/v1/b"]
      interval: 5s
      timeout: 3s
      retries: 5

  emulator-init:
    image: gcr.io/google.com/cloudsdktool/google-cloud-cli:latest
    depends_on:
      pubsub-emulator:
        condition: service_healthy
      fake-gcs:
        condition: service_healthy
    entrypoint: ["bash", "-c",
                 "curl -s -X PUT http://pubsub-emulator:8085/v1/projects/local-project/topics/ServicelinkerInboundQueue && \
                  curl -s -X PUT http://pubsub-emulator:8085/v1/projects/local-project/topics/ServicelinkerStatusQueue && \
                  curl -s -X PUT http://pubsub-emulator:8085/v1/projects/local-project/subscriptions/ServicelinkerInboundQueue \
                       -H 'Content-Type: application/json' -d '{\"topic\":\"projects/local-project/topics/ServicelinkerInboundQueue\"}' && \
                  curl -s -X PUT http://pubsub-emulator:8085/v1/projects/local-project/subscriptions/ServicelinkerStatusQueue \
                       -H 'Content-Type: application/json' -d '{\"topic\":\"projects/local-project/topics/ServicelinkerStatusQueue\"}' && \
                  curl -s -X POST http://fake-gcs:4443/storage/v1/b -H 'Content-Type: application/json' -d '{\"name\":\"marduk-exchange\"}' && \
                  curl -s -X POST http://fake-gcs:4443/storage/v1/b -H 'Content-Type: application/json' -d '{\"name\":\"servicelinker-exchange\"}' && \
                  echo '' && echo 'PubSub topics, subscriptions, and GCS buckets created.'"]

  servicelinker:
    build: .
    depends_on:
      emulator-init:
        condition: service_completed_successfully
    ports:
      - "8080:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"  # Linux; no-op on macOS
    environment:
      SPRING_CLOUD_GCP_PUBSUB_EMULATOR_HOST: pubsub-emulator:8085
      STORAGE_EMULATOR_HOST: http://fake-gcs:4443
      # OSRM URLs — overridden via .env when running scripts/port-forward-osrm.sh
      OSRM_URLS_BUS: ${OSRM_URLS_BUS:-https://router.project-osrm.org}
      OSRM_URLS_RAIL: ${OSRM_URLS_RAIL:-https://router.project-osrm.org}
      OSRM_URLS_FERRY: ${OSRM_URLS_FERRY:-https://router.project-osrm.org}
      OSRM_URLS_WATER: ${OSRM_URLS_WATER:-https://router.project-osrm.org}
      OSRM_URLS_DEFAULT: ${OSRM_URLS_DEFAULT:-https://router.project-osrm.org}
      # Note: no osrm-ferry service — FERRY mode shares osrm-water via port-forward
    # No healthcheck: the distroless image ships no shell or wget/curl to run one.
    # The trigger service waits on /actuator/health itself.

  # Simulates a marduk trigger. Run with: docker compose --profile trigger run --rm trigger
  # Place a NeTEx zip in test-data/ or set NETEX_FILE=/data/yourfile.zip
  trigger:
    profiles: [trigger]
    image: gcr.io/google.com/cloudsdktool/google-cloud-cli:latest
    depends_on:
      servicelinker:
        condition: service_started
    volumes:
      - ./test-data:/data:ro
    entrypoint: ["bash", "-c",
                 "set -e &&
                  echo 'Waiting for servicelinker...' &&
                  deadline=$$(($$(date +%s) + 120)) &&
                  until curl -sf --max-time 5 http://servicelinker:8080/actuator/health >/dev/null 2>&1; do [ $$(date +%s) -ge $$deadline ] && { echo 'ERROR: servicelinker not ready after 120s'; exit 1; }; sleep 2; done &&
                  FILE=$${NETEX_FILE:-$$(ls /data/*.zip 2>/dev/null | head -1)} &&
                  if [ -z \"$$FILE\" ]; then echo 'ERROR: place a NeTEx zip in test-data/ or set NETEX_FILE'; exit 1; fi &&
                  NAME=$$(basename \"$$FILE\") &&
                  echo \"Uploading $$NAME to marduk-exchange...\" &&
                  curl -sf -X POST \"http://fake-gcs:4443/upload/storage/v1/b/marduk-exchange/o?uploadType=media&name=$$NAME\" -H 'Content-Type: application/zip' --data-binary @\"$$FILE\" &&
                  CID=local-$$RANDOM &&
                  PAYLOAD=$$(printf '{\"messages\":[{\"data\":\"\",\"attributes\":{\"RutebankenTargetFileHandle\":\"%s\",\"RutebankenCorrelationId\":\"%s\",\"EnturDatasetReferential\":\"LOCAL\"}}]}' \"$$NAME\" \"$$CID\") &&
                  echo \"Publishing trigger (correlationId=$$CID)...\" &&
                  curl -sf -X POST http://pubsub-emulator:8085/v1/projects/local-project/topics/ServicelinkerInboundQueue:publish -H 'Content-Type: application/json' -d \"$$PAYLOAD\" &&
                  echo 'Done. Watch servicelinker logs for processing status.'"]

volumes:
  gcs-data:
