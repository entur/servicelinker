services:
  pubsub-emulator:
    image: gcr.io/google.com/cloudsdktool/google-cloud-cli:latest
    command: >
      bash -c "
        gcloud beta emulators pubsub start --host-port=0.0.0.0:8085 --project=local-project
      "
    ports:
      - "8085:8085"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8085"]
      interval: 5s
      timeout: 3s
      retries: 5

  fake-gcs:
    image: fsouza/fake-gcs-server:latest
    command: ["-scheme", "http", "-port", "4443", "-external-url", "http://localhost:4443", "-public-host", "localhost:4443"]
    ports:
      - "4443:4443"
    volumes:
      - gcs-data:/storage
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:4443/storage/v1/b"]
      interval: 5s
      timeout: 3s
      retries: 5

  emulator-init:
    image: gcr.io/google.com/cloudsdktool/google-cloud-cli:latest
    depends_on:
      pubsub-emulator:
        condition: service_healthy
      fake-gcs:
        condition: service_healthy
    entrypoint: ["bash", "-c", "curl -s -X PUT http://pubsub-emulator:8085/v1/projects/local-project/topics/servicelinker-inbound && curl -s -X PUT http://pubsub-emulator:8085/v1/projects/local-project/topics/servicelinker-outbound && curl -s -X PUT -H 'Content-Type: application/json' -d '{\"topic\":\"projects/local-project/topics/servicelinker-inbound\"}' http://pubsub-emulator:8085/v1/projects/local-project/subscriptions/servicelinker-inbound-sub && curl -s -X PUT -H 'Content-Type: application/json' -d '{\"topic\":\"projects/local-project/topics/servicelinker-outbound\"}' http://pubsub-emulator:8085/v1/projects/local-project/subscriptions/servicelinker-outbound-sub && curl -s -X POST -H 'Content-Type: application/json' -d '{\"name\":\"marduk-exchange\"}' http://fake-gcs:4443/storage/v1/b && curl -s -X POST -H 'Content-Type: application/json' -d '{\"name\":\"servicelinker-exchange\"}' http://fake-gcs:4443/storage/v1/b && echo '' && echo 'PubSub topics, subscriptions, and GCS buckets created.'"]

  servicelinker:
    build: .
    depends_on:
      emulator-init:
        condition: service_completed_successfully
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: local
      PUBSUB_EMULATOR_HOST: pubsub-emulator:8085
      STORAGE_EMULATOR_HOST: http://fake-gcs:4443
      GCP_PROJECT_ID: local-project
      GCS_INPUT_BUCKET: marduk-exchange
      GCS_OUTPUT_BUCKET: servicelinker-exchange
      PUBSUB_INBOUND_SUBSCRIPTION: servicelinker-inbound-sub
      PUBSUB_OUTBOUND_TOPIC: servicelinker-outbound
      OSRM_URL_DEFAULT: https://router.project-osrm.org

volumes:
  gcs-data:
